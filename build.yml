name: Build Pixel Radar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download Forge MDK 1.16.5
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.16.5-36.2.39/forge-1.16.5-36.2.39-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
      - name: Install mod sources
        run: |
          rm -rf mdk/src
          cp -r src mdk/src
          cd mdk
          sed -i "s/^version = .*/version = '1.0.0'/; s/^group = .*/group = 'fr.pixelradar'/; s/^archivesBaseName = .*/archivesBaseName = 'pixelradar'/; s/examplemod/pixelradar/g" build.gradle
      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pixelradar-jar
          path: mdk/build/libs/*.jar
